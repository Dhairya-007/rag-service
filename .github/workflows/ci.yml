name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci

      # @rag/api imports @rag/core's build output, so core goes first.
      - name: Build core
        run: npm run build --workspace @rag/core

      - name: Test core
        run: npm test --workspace @rag/core

      - name: Test API
        run: npm test --workspace @rag/api

      - name: Typecheck web
        run: npm run typecheck --workspace @rag/web

      - name: Build API
        run: npm run build --workspace @rag/api

      - name: Build web
        run: npm run build --workspace @rag/web
